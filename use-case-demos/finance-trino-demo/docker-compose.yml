services:
  trino:
    image: trinodb/trino:${TRINO_VERSION}
    container_name: trino
    networks:
      demo_net:
    ports:
      - 8080:8080
    volumes:
      - ./trino/catalog:/etc/trino/catalog
  puppygraph:
    image: puppygraph/puppygraph:${PUPPYGRAPH_VERSION}
    container_name: puppygraph
    networks:
      demo_net:
    environment:
      - PUPPYGRAPH_USERNAME=puppygraph
      - PUPPYGRAPH_PASSWORD=puppygraph123
    ports:
      - "8081:8081"
      - "8182:8182"
      - "7687:7687"
  rest:
    image: apache/iceberg-rest-fixture:${ICEBERG_REST_FIXTURE_VERSION}
    container_name: iceberg-rest
    networks:
      demo_net:
    ports:
      - 8181:8181
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://object-store:9000
      - CATALOG_S3_PATH__STYLE__ACCESS=true
  object-store:
    image: rustfs/rustfs:${RUSTFS_VERSION}
    container_name: object-store
    environment:
      - RUSTFS_ACCESS_KEY=admin
      - RUSTFS_SECRET_KEY=password
      - RUSTFS_OBS_LOG_STDOUT_ENABLED=true
      - RUSTFS_SERVER_DOMAINS=minio
    networks:
      demo_net:
        aliases:
          - minio
          - warehouse.minio
    ports:
      - 9001:9001
      - 9000:9000
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 5
  create-bucket:
    image: rustfs/rustfs:${RUSTFS_VERSION}
    container_name: create-bucket
    depends_on:
      object-store:
        condition: service_healthy
    networks:
      demo_net:
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        curl -sf -o /dev/null --aws-sigv4 aws:amz:us-east-1:s3 --user admin:password
        --head http://object-store:9000/warehouse ||
        curl -sSf --aws-sigv4 aws:amz:us-east-1:s3 --user admin:password
        -X PUT http://object-store:9000/warehouse
networks:
  demo_net:
